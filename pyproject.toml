[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencanal"
version = "0.1.0"
description = "opencanal (오픈커널, OpenCanAI) — connect second brains, grow deltabrains."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
opencanal = "opencanal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
